# zimantic settings.

# Relative paths (like ./zims) are relative to the folder you run `python -m zimantic` from (this project folder)
#  Absolute paths also work, e.g. /mnt/usb/zims or C:/zims.

# ---------------------------------------------------------------------------------------------
# WHERE YOUR FILES ARE.
# The defaults are folders inside this project; change them if your files live elsewhere.
# ---------------------------------------------------------------------------------------------

# Your .zim files: (download them from https://library.kiwix.org).
# `python -m zimantic build <name>`    looks for <name>.zim in this folder.
zim_dir: ./zims

# The embedding model: this folder must contain model.onnx and sentencepiece.bpe.model
# (see "Download the model" in the README).
model_dir: ./model

# Where indexes are written: <zim name>.sqlite and <zim name>.faiss for each ZIM.
# Created automatically. 
# (Recomended; for large ZIMs, build the index on a faster machine and copy both files here)
index_dir: ./indexes

# ---------------------------------------------------------------------------------------------
# SERVER
# ---------------------------------------------------------------------------------------------

# Port for the search page: http://<this machine>:<port>. 
# Reachable from other devices on the network.
port: 8090

# Where result links open the article, served by kiwix-serve (optional; search works without it).
# Links become <kiwix_url>/<zim name>/<article path>. Use this machine's address instead of
# localhost if people open the search page from other devices.
kiwix_url: http://localhost:8080/content

# ---------------------------------------------------------------------------------------------
# TUNING (the defaults are fine to start with)
# ---------------------------------------------------------------------------------------------

# Results shown per search.
results: 30

# Articles embedded at once while indexing. Higher is faster but uses more memory.
# Use ~8 on a Raspberry Pi Zero 2 W.
batch_size: 32

# Large ZIMs only (10,000+ articles): how many groups of vectors each search scans.
# Higher = more accurate but slower. Lower it if searches are slow or memory runs out on a Pi.
# In testing on a 28k-article ZIM, 64 was about as accurate as scanning everything.
nprobe: 64

# A naive approach to determining if query requires a deeper search (e.g. pasted sentences from article)
# Searches with 'long_query' words or more will double kiwix's full-text result weights.
# Rule of thumb: long searchs are usually pasted sentence or remembered text.  
# Set very high (e.g. 1000) to turn the doubling off.
long_query: 10