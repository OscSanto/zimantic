# Zimantic settings. This file is optional; omitted keys use hardware-based defaults.
# See config.pi-zero-2w.toml and config.pi-5.toml for tuned starting points.

# Relative paths use the directory where `zimantic` runs.
# Absolute paths also work.

# On Linux and other XDG platforms, omitted paths default under
# $XDG_DATA_HOME/zimantic (normally ~/.local/share/zimantic).
# Relative path overrides in this file are relative to that data directory.
# An existing config.toml in the current directory keeps its historical
# current-directory-relative behavior.
#
# Collections are declared with [[collections]] at the end of this file. Each
# configured root/server is one collection; each ZIM archive is one source.
# Add a local ZIM collection (downloaded from https://library.kiwix.org):
#
# [[collections]]
# type = "zim"
# name = "library"
# path = "zims"
#
# Must contain model.onnx and either sentencepiece.bpe.model (multilingual-e5)
# or vocab.txt (English e5-v2). `zimantic model` writes model/int8 (the CPU
# default) or model/fp16 (recommended with a GPU).
# model_dir = "model/int8"
#
# Where indexes are written: <zim name>.sqlite and <zim name>.faiss for each ZIM.
# catalog.sqlite lives beside this directory.
# index_dir = "indexes"

# SERVER

# Search page port; reachable from other devices on the network.
port = 8090

# Optional URL path prefix when a reverse proxy strips it before forwarding.
# web_base_path = "/zimantic"

# Sandbox article documents in the browser (secure browsing). Off by default
# because local ZIMs are trusted input and sandboxing isolates Web Storage and
# IndexedDB (some offline sites lose persistence). Enable this when serving ZIMs
# from untrusted sources; the shell itself stays trusted and the article is
# isolated inside it.
# secure_browsing = false

# Optional Kiwix collections are declared with [[collections]] type = "kiwix".
# Point server at a running kiwix-serve HTTP API (not a ZIM folder); with the
# standard local setup this is often http://localhost:8085.

# TUNING

# Results per page in the UI and API. Values above max_results are clamped to
# max_results because a page is sliced from the ranked pool.
# page_size = 10

# Previews are read from the ZIM at request time. Hydrate at most this many
# results per page; the rest keep an empty lead. 0 disables preview hydration.
# preview_limit = 10

# Largest ranked result pool kept and served. Pages are drawn from this pool.
# Desktop 100, mobile 50, supercomputer 200.
# max_results = 100

# Articles embedded per batch. Desktop 32, mobile 8, supercomputer 128.
# Larger batches use more memory; use about 8 on a Pi Zero 2 W.
# batch_size = 32

# Independent ZIMs can be built concurrently. When unset, the default scales with
# available CPU and RAM; set it explicitly to override the automatic worker count.
# Values below 1 warn and fall back to the automatic default.
# build_workers = 2

# ONNX Runtime threads for embedding. Unset leaves a core for search and the web server.
# Desktop auto, mobile 2, supercomputer 8.
# embed_threads = 3

# Embedding device. "auto" (the default) tries every accelerated provider the
# installed ONNX Runtime build exposes (CUDA, ROCm, DirectML, OpenVINO) and
# otherwise runs on the CPU. "gpu" requires an accelerated provider; "cpu"
# forces the CPU. Other values: cuda, rocm, directml/dml (Windows), openvino
# (Intel, OpenVINO AUTO device selection) or coreml (Apple, must be requested
# explicitly). GPU support comes from the ONNX Runtime package, not this
# setting: replace onnxruntime with onnxruntime-gpu (CUDA), onnxruntime-rocm,
# onnxruntime-directml or onnxruntime-openvino. An unavailable device, or a run
# that fails on it, falls back to the CPU with a warning.
# `zimantic build --device ...` and `zimantic serve --device ...` override this
# setting.
# embed_device = "auto"

# Maximum simultaneous embedding calls when multiple ZIMs are being built.
# When unset, the default accounts for build_workers, CPU threads and available RAM.
# Only used when build_workers is greater than 1. Values below 1 warn and fall
# back to the automatic default.
# embedding_workers = 2

# Maximum HTML read per article.
# max_html_bytes = 4_194_304

# Maximum decompressed entry materialized while building. Desktop 1 GiB,
# mobile 256 MiB, supercomputer 4 GiB. This is intentionally high for large,
# friendly ZIM articles; lower it on memory-constrained hosts.
# max_entry_bytes = 1073741824

# Maximum uncompressed local ZIM entry served or previewed. This caps per-request memory use for
# HTML and binary assets alike; max_html_bytes is the separate parser limit.
# max_article_bytes = 33_554_432

# Maximum preview characters extracted for displayed results; build-time extraction is transient.
# max_preview_chars = 1_000

# Maximum lexical body text per item indexed into the contentless body FTS.
# This is independent of max_preview_chars. Longer text is cut at a UTF-8
# character boundary and counted in body_truncated_count.
# max_body_text_bytes = 1_048_576

# Maximum optional derived-preview cache bytes per source. Reaching it omits
# new preview artifacts, never searchable postings.
# max_derived_cache_bytes_per_source = 536_870_912

# Optional build-time derived-text engines. Operations stay off unless an
# exact [[collections.sources]] override enables them.
# [derived_text]
# max_caption_bytes = 1_048_576
# ocr_languages = ["eng"]
# max_ocr_pages = 20
# max_ocr_pixels = 50_000_000
# max_ocr_output_bytes = 262_144
# asr_model = "base.en"
# max_asr_seconds = 3_600
# max_asr_bytes = 1_073_741_824
# max_asr_output_bytes = 1_048_576
# task_timeout_seconds = 7_200
# max_spool_bytes = 2_147_483_648
# workers = "auto"
# cache = true

# Large ZIMs only (10,000+ articles): how many IVF clusters each search scans.
# By default, searches scan about 6% of the clusters, scaling automatically with ZIM size.
# Higher = more accurate but slower. Set this to a fixed integer to override the automatic value.
# nprobe = 64

# Meaning matches below this cosine similarity are discarded when the source
# also has a title or full-text match. A meaning-only query keeps its best
# candidates regardless, so this cannot turn it into an empty result list.
# Lower it (0.80) when a lexical match should not suppress broader meaning
# matches, for example for cross-language queries.
# min_cosine_similarity = 0.85

# Search workers. Desktop 8, mobile 2, supercomputer 16. More workers reduce
# wall-clock time when many ZIMs are on separate storage, but increase
# concurrent I/O and SQLite connections.
# search_workers = 8
# Maximum simultaneous user searches. Desktop 4, mobile 2, supercomputer 8.
# Several people can search at once up to this many; each search may still use
# all source workers. Lower it on a Pi.
# max_concurrent_searches = 4
# Minimum candidates requested from each source before fusion. Desktop/mobile
# 16, supercomputer 32. The per-source count scales with the number of sources;
# this is the floor, so a single source still returns the whole pool. Raise it
# to trade speed for recall.
# candidate_count = 16
# Maximum completion-spaced intermediate ranking passes during a streamed
# search. Desktop 16, mobile 8, supercomputer 32. Timed snapshots are still
# emitted about every 700 ms, and the final ranking always includes every source;
# lower this on slow CPUs.
# max_stream_ranks = 16
# Timeout for each Kiwix catalog and search request, in seconds.
# source_timeout = 12
# Monotonic deadline for one admitted search (scheduling, ranking and bounded
# previews). Default 30; must be positive.
# search_timeout_seconds = 30
# Source chips shown per collection group in the search filter before "Other".
# source_filter_limit = 10
# Bounded first page of preview sources loaded for one library collection card.
# collection_source_limit = 10
# Global request-work cap for an explicitly selected Kiwix collection. A
# single explicit source is never capped. Reaching it reports a partial scope.
# max_explicit_collection_sources = 500
# Seconds a search waits for a free slot before reporting busy. Keep this at
# least as long as a typical cold search on the host so overlapping requests
# queue instead of returning 503.
# slot_wait_seconds = 10
# Exact-query LRU cache. Set cache_size to 0 to disable.
# Desktop 256, mobile 64, supercomputer 1024.
# cache_size = 256
# The byte budget applies independently to the search and preview caches.
# Desktop 32 MiB, mobile 8 MiB, supercomputer 256 MiB.
# cache_bytes = 33_554_432

# COLLECTIONS
#
# [[collections]]
# type = "zim"
# name = "library"
# path = "zims"
#
# [[collections]]
# type = "kiwix"
# name = "kiwix"
# label = "Kiwix"
# server = "http://localhost:8085"
# catalog_path = "/kiwix/catalog/v2/entries"
# catalog_limit = 1000
# max_catalog_entries = 50000
# max_response_bytes = 67108864
# Maximum remote sources searched by an unscoped query for this server entry.
# Explicit source selections are still honored; 0 keeps unscoped searches local.
# max_remote_sources = 100
#
# Search and serve an ordinary directory tree, for example an offline copy of
# /library/www/html/modules. One configured directory is one collection. The
# default granularity keeps the whole root as one source; "children" makes each
# immediate child directory a source plus one source for loose root files.
# Source keys change when a large collection collapses past max_sources, so a
# rebuild and an updated [[collections.sources]] key are required after that.
#
# [[collections]]
# type = "files"
# name = "modules"
# path = "/library/www/html/modules"
# label = "Modules"
# granularity = "collection"
# include = ["**/*.html", "**/*.htm", "**/*.xhtml",
#            "**/*.txt", "**/*.md", "**/*.pdf"]
# exclude = ["**/node_modules/**", "**/.git/**", "**/__pycache__/**"]
# max_sources = 64
# max_entries = 100000
# max_file_bytes = 268435456
#
# Search and serve a local Kolibri installation. Supported target: Kolibri
# v0.19.5 installed SQLite schema. Kolibri does not need to be running. Each
# installed channel becomes one collection; "children" makes each top-level
# topic a source plus an Ungrouped source for direct leaves. The installation
# is read only: Zimantic creates private consistent snapshots outside
# path/content/storage and never writes the database or its WAL/SHM sidecars.
# IIAB-style example:
#
# [[collections]]
# type = "kolibri"
# name = "kolibri"
# path = "/library/kolibri"
# label = "Kolibri"
# granularity = "children"          # "children" or "collection"
# max_sources = 64
# max_entries = 500000
# max_snapshot_bytes = 1073741824
# snapshot_disk_budget_bytes = 3221225472
# snapshot_timeout_seconds = 10
# max_html5_zip_entries = 10000
# max_html5_zip_directory_bytes = 8388608
# max_html5_zip_member_bytes = 268435456
# max_html5_zip_total_bytes = 1073741824
# html5_zip_timeout_seconds = 10
# Optional overrides for non-standard installations:
# database_path = "/library/kolibri/db.sqlite3"
# storage = "/library/kolibri/content/storage"
#
# Optional exact-source enrichment overrides. Discover the key first; absent
# switches stay off. captions reads .srt/.vtt sidecars and embedded text tracks
# (embedded tracks use the shared ffmpeg adapter when available), ocr reads
# images and image-only PDF pages, and asr transcribes audio/video. The same
# switches work for Kolibri sources, for example:
# key = "kolibri:kolibri:<channel_id>:root"
# [[collections.sources]]
# key = "files:modules:root"
# captions = "index"
# ocr = "tesseract"
# asr = "whisper"
