# zimantic settings tuned for a Raspberry Pi 5 (4 cores, 4-8 GB RAM).
#
# config.toml is optional: without it zimantic auto-detects your hardware.
# Copy this file over config.toml when you want to pin these values, and adjust
# the paths if needed. There is enough RAM here to keep a larger result pool and
# cache, and enough CPU to embed in bigger batches and serve several searches
# at once.

zim_dir = "./zims"
model_dir = "./model"
index_dir = "./indexes"

port = 8090
kiwix_url = "http://localhost:8085/content"
kiwix_server = ""
kiwix_catalog_path = "/kiwix/catalog/v2/entries?count=-1"
kiwix_search_path = "/kiwix/search"

page_size = 10
max_results = 100

# 16 is a good middle ground on a Pi 5; benchmark 32 against your ZIMs.
batch_size = 16

max_html_bytes = 4_194_304
max_preview_chars = 1_000
max_embedding_tokens = 256
preview_overflow = "skip"
embedding_overflow = "truncate"

# Leave one core for search workers and the web server.
embed_threads = 3

# nprobe = 64
min_cosine_similarity = 0.85
long_query = 10
disambiguation_boost = 0.08
disambiguation_penalty = 0.5

search_workers = 4
max_concurrent_searches = 4
candidate_count = 16
source_timeout = 12

cache_size = 256
cache_bytes = 33_554_432  # 32 MiB
