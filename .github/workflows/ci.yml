name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (x86_64, py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      # `dev` is a PEP 735 dependency group; `uv sync` installs it by default.
      # `--locked` fails if uv.lock is out of date.
      - run: uv sync --locked
      - run: uv run pytest -q

  arm64:
    name: test (arm64, py3.14)
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run pytest -q

  armhf:
    name: native dependency check (armhf)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3

      - name: Install Debian native dependencies and smoke-test
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/app" -w /app \
            arm32v7/debian:bookworm-slim \
            sh -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3-faiss \
                python3-libzim \
                python3-onnx
              PYTHONPATH=/app /usr/bin/python3 -c "
              import faiss
              import onnx
              from libzim.reader import Archive
              from libzim.search import Searcher
              from zimantic.search import Search
              print(f\"armhf native dependencies loaded (onnx {onnx.__version__})\")
              "
            '
