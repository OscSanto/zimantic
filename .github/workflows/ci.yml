name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (x86_64, py3.14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: astral-sh/setup-uv@main
        with:
          python-version: "3.14"
          enable-cache: true
      # `dev` is a PEP 735 dependency group; `uv sync` installs it by default.
      # `--locked` fails if uv.lock is out of date.
      - run: uv sync --locked
      - run: uv run pytest -q

  arm64:
    name: test (arm64, py3.14)
    needs: test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-python@main
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@main
      - run: uv sync --locked
      - run: uv run pytest -q

  armhf:
    name: native dependency check (armhf)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: docker/setup-qemu-action@master

      - name: Install Debian native dependencies and smoke-test
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/app" -w /app \
            arm32v7/debian:bookworm-slim \
            sh -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3-faiss \
                python3-libzim \
                python3-onnx
              PYTHONPATH=/app /usr/bin/python3 -c "import faiss, onnx; from libzim.reader import Archive; from libzim.search import Searcher; from zimantic.search import Search; print(onnx.__version__)"
            '
