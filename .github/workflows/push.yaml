name: PyTest and Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Manual runs execute the test matrix without publishing.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected ref to PyPI after tests
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: test (x86_64, py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@main

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@main

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest -q

  arm64:
    name: test (arm64, py3.14)
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@main

      - name: Setup Python
        uses: actions/setup-python@main
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@main

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest -q

  armhf:
    name: native dependency check (armhf)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@main
      - uses: docker/setup-qemu-action@master

      - name: Install Debian native dependencies and smoke-test
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD:/app" -w /app \
            arm32v7/debian:trixie-slim \
            sh -euxc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3-faiss \
                python3-libzim \
                python3-onnxruntime \
                python3-sentencepiece
              PYTHONPATH=/app /usr/bin/python3 -c "import faiss, onnxruntime, sentencepiece; from libzim.reader import Archive; from libzim.search import Searcher; from zimantic.embed import Embedder; from zimantic.search import Search; print(onnxruntime.__version__)"
            '

  publish:
    needs: [test, arm64, armhf]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@main
      - uses: astral-sh/setup-uv@main

      - name: Build package
        run: uv build --no-sources --clear

      - name: Publish package
        run: uv publish

  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Release ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
