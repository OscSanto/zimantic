name: PyTest and Publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Manual runs execute the test matrix without publishing.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected ref to PyPI after tests
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: test (x86_64, py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --locked pytest -q

  arm:
    name: test (arm64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3

      - name: Run tests under emulation
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/app" -w /app \
            python:3.14-slim \
            sh -c "pip install uv \
                   && uv sync --locked --no-build \
                   && uv run --locked pytest -q"

  publish:
    needs: [test, arm]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.0

      - name: Build package
        run: uv build --no-sources --clear

      - name: Publish package
        run: uv publish

  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Create GitHub release
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "Release ${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
