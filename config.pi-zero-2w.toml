# Settings tuned for a Raspberry Pi Zero 2 W (4 cores, 512 MB RAM).
# Copy this file to config.toml to use them. Build indexes elsewhere or use `build --fast`.

# Matches `zimantic model` (int8 default). Use ./model/fp16 with a GPU.
model_dir = "./model/int8"
index_dir = "./indexes"

port = 8090
# Optional URL of a running kiwix-serve HTTP API for catalog discovery and
# remote full-text fallback; leave blank to use only local Zimantic indexes.

page_size = 10
# Smaller pool to reduce cache and ranking work.
max_results = 50

# Small batches save RAM.
batch_size = 8

# Keep builds serial on the low-memory profile.
build_workers = 1

max_html_bytes = 4_194_304
max_entry_bytes = 268435456
max_article_bytes = 33_554_432
max_preview_chars = 1_000

# Leave CPU for search workers.
embed_threads = 2
# Only used when build_workers is greater than 1.
# embedding_workers = 1

# nprobe = 64
min_cosine_similarity = 0.85

search_workers = 2
max_concurrent_searches = 2
candidate_count = 16
max_stream_ranks = 8
source_timeout = 12

cache_size = 64
cache_bytes = 8_388_608  # 8 MiB per cache

[[collections]]
type = "zim"
name = "library"
path = "./zims"

