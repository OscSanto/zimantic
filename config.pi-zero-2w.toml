# Settings tuned for a Raspberry Pi Zero 2 W (4 cores, 512 MB RAM).
# Copy this file to config.toml to use them. Build indexes elsewhere or use `build --fast`.

zim_dir = "./zims"
model_dir = "./model"
index_dir = "./indexes"

port = 8090
# Optional Kiwix compatibility for remote-only results. Start kiwix-serve separately:
#   kiwix-serve --port=8085 ./zims/*.zim
# Then uncomment this setting (use this machine's address for other clients):
# kiwix_url = "http://localhost:8085/content"
# Optional URL of a running kiwix-serve HTTP API for catalog discovery and
# remote full-text fallback; leave blank to use only local Zimantic indexes.
kiwix_server = ""
kiwix_catalog_path = "/kiwix/catalog/v2/entries?count=50000"
kiwix_search_path = "/kiwix/search"
kiwix_catalog_limit = 50000
kiwix_result_limit = 1000
max_kiwix_response_bytes = 67108864

page_size = 10
# Smaller pool to reduce cache and ranking work.
max_results = 50

# Small batches save RAM.
batch_size = 8

max_html_bytes = 4_194_304
max_entry_bytes = 268435456
max_article_bytes = 33_554_432
max_preview_chars = 1_000
embedding_tokens = 256

# Leave CPU for search workers.
embed_threads = 2

# nprobe = 64
min_cosine_similarity = 0.85
long_query = 10
disambiguation_boost = 0.08
disambiguation_penalty = 0.5

search_workers = 2
max_concurrent_searches = 2
candidate_count = 16
source_timeout = 12

cache_size = 64
cache_bytes = 8_388_608  # 8 MiB
