[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "zimantic"
version = "0.1.0"
description = "Offline semantic search for Kiwix ZIM files"
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "numpy",
    "tqdm",
    "onnxruntime",
    "sentencepiece",
    "faiss-cpu",
    "libzim",
    "fastapi",
    "uvicorn",
]

[dependency-groups]
# Development and test-only tools. httpx2 backs FastAPI's TestClient; the
# application itself uses urllib, so it is not a runtime dependency.
dev = [
    "pytest",
    "httpx2",
]

[project.scripts]
zimantic = "zimantic.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["zimantic*"]

[tool.setuptools.package-data]
zimantic = ["index.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "__pypackages__",
]
