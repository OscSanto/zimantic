[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "zimantic"
version = "0.1.0"
description = "Offline semantic search for Kiwix ZIM files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "tqdm",
    "onnxruntime",
    "sentencepiece",
    "faiss-cpu",
    "libzim",
    "fastapi",
    "uvicorn",
    "pymupdf",
]

[dependency-groups]
# Development and test-only tools; the application does not need them at runtime.
dev = [
    "pytest",
    "httpx2",
]

[project.scripts]
zimantic = "zimantic.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["zimantic*"]

[tool.setuptools.package-data]
"zimantic.web" = [
    "static/index.html",
    "static/favicon.ico",
    "static/favicon-16x16.png",
    "static/favicon-32x32.png",
    "static/apple-touch-icon.png",
    "static/android-chrome-192x192.png",
    "static/android-chrome-512x512.png",
    "static/site.webmanifest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "__pypackages__",
]
