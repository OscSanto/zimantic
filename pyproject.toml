[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "zimantic"
version = "1.0.0"
description = "Offline semantic search for Kiwix ZIM files"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "numpy",
    "tqdm",
    "onnxruntime",
    "sentencepiece",
    "faiss-cpu",
    "libzim",
    "fastapi",
    "uvicorn",
    "pymupdf",
    # Published CPython wheel platforms; others use the stdlib HTML fallback.
    "selectolax; implementation_name == 'cpython' and sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
    "selectolax; implementation_name == 'cpython' and sys_platform == 'darwin' and (platform_machine == 'x86_64' or platform_machine == 'arm64')",
    "selectolax; implementation_name == 'cpython' and sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64' or platform_machine == 'x86')",
    "puremagic>=1.30",
]

[project.optional-dependencies]
# Explicit opt-in for a separately installed/built Lexbor on other platforms.
lexbor = ["selectolax"]

[dependency-groups]
# Development and test-only tools; the application does not need them at runtime.
dev = [
    "pytest",
    "httpx2",
]

[project.scripts]
zimantic = "zimantic.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["zimantic*"]

[tool.setuptools.package-data]
"zimantic.web" = [
    "static/*",
    "static/mathjax/LICENSE",
    "static/mathjax/README.md",
    "static/mathjax/HTML-CSS/TeX/woff/*.woff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "__pypackages__",
]

[tool.ty.rules]
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"

