<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zimantic</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --border: #2a2f3a;
      --text: #e6e8eb;
      --muted: #9aa3af;
      --accent: #4f9cf9;
      --mark-bg: rgba(79, 156, 249, .18);
      --ok: #7fd99a;
      --ok-border: #2e5c3f;
      --err: #e06a6a;
      --err-border: #5c2e2e;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9;
        --panel: #fff;
        --border: #dde1e7;
        --text: #1b1f24;
        --muted: #5d6673;
        --accent: #1f6fd6;
        --mark-bg: rgba(31, 111, 214, .12);
        --ok: #1f7a3d;
        --ok-border: #a8d8b8;
        --err: #b42318;
        --err-border: #f0b4ae;
      }
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: flex-start;
      font: 16px/1.5 system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px 60px;
    }
    body:not(.search-active) { align-items: center; }
    .wrap { width: 100%; max-width: 870px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    .subtitle, .help, .status, .filter-line, .result-meta { color: var(--muted); }
    .subtitle { font-size: .9rem; margin-bottom: 20px; }
    form { display: flex; gap: 8px; }
    input[type="search"] {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      background: var(--accent);
      color: #fff;
      border: 0;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { cursor: default; opacity: .6; }
    button.secondary, button.source-filter-option {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-weight: 400;
    }
    button.secondary { padding: 6px 12px; font-size: .85rem; }
    .status { min-height: 1.4em; margin: 12px 0 6px; font-size: .85rem; }
    .query-used { color: var(--accent); font-family: var(--mono); }
    .source-filters { margin-bottom: 8px; }
    .source-filter-toolbar {
      align-items: center;
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .source-filter-heading, .source-filter-status {
      color: var(--muted);
      font-size: .85rem;
    }
    .source-filter-search {
      flex: 1;
      max-width: 360px;
      padding: 6px 10px !important;
      font-size: .85rem !important;
    }
    .source-filter-options { display: flex; flex-wrap: wrap; gap: 6px; }
    button.source-filter-option {
      border-radius: 100px;
      font-size: .75rem;
      max-width: 100%;
      overflow-wrap: anywhere;
      padding: 3px 10px;
    }
    button.source-filter-option.ok { border-color: var(--ok-border); color: var(--ok); cursor: pointer; }
    button.source-filter-option.err { border-color: var(--err-border); color: var(--err); }
    button.source-filter-option[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .source-filter-status { margin-top: 6px; font-size: .78rem; }
    .filter-line { min-height: 1.2em; font-size: .85rem; margin-bottom: 14px; }
    .pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 18px 0 8px; font-size: .85rem; }
    .pager:empty { display: none; }
    .pager a, .pager span { padding: 6px 12px; }
    .pager a { color: var(--accent); }
    .pager .disabled { color: var(--muted); }
    .linklike { background: none; border: 0; color: var(--accent); padding: 0; text-decoration: underline; }
    .notice {
      background: var(--panel);
      border: 1px solid var(--err-border);
      border-radius: 8px;
      margin-bottom: 16px;
      padding: 10px 12px;
      font-size: .9rem;
    }
    ol.results { list-style: none; margin: 0; padding: 0; }
    .result {
      align-items: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      gap: 14px;
      margin-bottom: 10px;
      padding: 14px 16px;
      transition: opacity .18s ease, transform .18s ease;
      will-change: transform;
    }
    .result-body { flex: 1; min-width: 0; }
    .result-title { font-size: 1.02rem; font-weight: 600; }
    .result-title a { color: var(--text); text-decoration: none; }
    .result-title a:hover { color: var(--accent); text-decoration: underline; }
    .result-media {
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--muted);
      display: inline-flex;
      font: .65rem var(--mono);
      line-height: 1;
      margin-left: 6px;
      padding: 2px 4px;
      pointer-events: none;
      vertical-align: .12em;
    }
    .result-meta { font-size: .8rem; margin: 2px 0 6px; }
    .result-snippet { font-size: .92rem; margin-top: 6px; overflow-wrap: anywhere; }
    .result-snippet p {
      margin: 0 0 8px;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .result-snippet p:last-child { margin-bottom: 0; }
    .result-snippet mark {
      background: unset;
      color: var(--accent);
      font-style: italic;
      font-weight: 600;
    }
    .result-snippet.none { color: var(--muted); font-style: italic; }
    .result-thumb {
      background: var(--mark-bg);
      border-radius: 6px;
      flex: 0 0 197px;
      height: 144px;
      overflow: hidden;
    }
    .result-thumb img { display: block; height: 100%; object-fit: cover; width: 100%; }
    .modal-open { overflow: hidden; }
    .article-modal[hidden] { display: none; }
    .article-modal {
      inset: 0;
      position: fixed;
      z-index: 1000;
    }
    .article-modal-backdrop {
      background: rgba(0, 0, 0, .68);
      border: 0;
      border-radius: 0;
      cursor: default;
      inset: 0;
      padding: 0;
      position: absolute;
    }
    .article-modal-dialog {
      background: var(--panel);
      border: 0;
      border-radius: 0;
      box-shadow: none;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      margin: 0;
      max-width: none;
      overflow: hidden;
      position: relative;
      width: 100%;
    }
    .article-modal-frame {
      background: #fff;
      border: 0;
      flex: 1;
      min-height: 0;
      width: 100%;
    }
    .empty { color: var(--muted); padding: 16px 0; }
    .source-list { display: grid; gap: 4px; }
    .source-list label { align-items: flex-start; display: flex; gap: 8px; padding: 4px; }
    .source-list label.unavailable { opacity: .55; }
    .source-list code { color: var(--muted); font: .75rem var(--mono); }
    details { border-top: 1px solid var(--border); margin-top: 28px; padding-top: 14px; }
    summary { color: var(--muted); cursor: pointer; font-size: .88rem; }
    .help { font-size: .85rem; margin: 10px 0; }
    .settings-actions { align-items: center; display: flex; gap: 8px; margin-top: 8px; }
    .settings-status { color: var(--muted); font-size: .82rem; }
    .result-enter { opacity: 0; transform: translateY(8px); }
    .result-exit { pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
    @media (max-width: 480px) {
      .result-thumb { flex-basis: 128px; height: 96px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>Zimantic</h1>
  <div class="subtitle">Search your offline library by meaning, title, or full text. Results arrive as each source finishes.</div>

  <form id="searchForm" autocomplete="off">
    <input id="question" type="search" placeholder="how to change a lightbulb" aria-label="Search query">
    <button id="searchButton" type="submit">Search</button>
  </form>

  <div class="status" id="status"></div>
  <div class="source-filters" id="sourceFilters" hidden>
    <div class="source-filter-toolbar">
      <span class="source-filter-heading">Filter by source</span>
      <input id="sourceFilterSearch" class="source-filter-search" type="search"
        placeholder="Search sources" aria-label="Search sources">
    </div>
    <div class="source-filter-options" id="sourceFilterOptions"
      role="group" aria-label="Filter by source"></div>
    <div class="source-filter-status" id="sourceFilterStatus" aria-live="polite"></div>
  </div>
  <div class="filter-line" id="filterLine"></div>
  <div id="notice"></div>
  <div id="results"><div class="empty"></div></div>
  <nav class="pager" id="pager" aria-label="Results pagination"></nav>
</div>

<div id="articleModal" class="article-modal" hidden>
  <button class="article-modal-backdrop" type="button" tabindex="-1" aria-label="Close article"></button>
  <section class="article-modal-dialog" role="dialog" aria-modal="true" aria-label="Article">
    <iframe id="articleModalFrame" class="article-modal-frame" title="Article" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  </section>
</div>

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);
  let PAGE_SIZE = 10;  // replaced with the server's page_size at startup
  const AUTO_SUBMIT_DELAY = 250;
  const STREAM_RENDER_DELAY = 75;
  const BUSY_RETRY_BASE_DELAY = 1000;
  const BUSY_RETRY_MAX_DELAY = 8000;
  const BUSY_RETRY_LIMIT = 5;
  const THUMB_LIMIT = 128 * 1024;
  const THUMB_CONCURRENCY = 4;
  const SOURCE_FILTER_LIMIT = 10;
  const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  let sources = [];
  let current = null;
  let selectedSourceKeys = new Set();
  let sourceFilterQuery = "";
  let requestController = null;
  let pageController = null;
  let searchSequence = 0;
  let autoSubmitTimer = null;
  let resultList = null;
  let thumbnailGeneration = 0;
  const thumbnailCache = new Map();
  const thumbnailQueue = [];
  const thumbnailControllers = new Set();
  let activeThumbnails = 0;
  let streamRenderTimer = null;
  let modalPreviousFocus = null;
  let activeModalUrl = null;
  let modalRootPending = false;

  function cancelStreamRender() {
    if (streamRenderTimer !== null) {
      clearTimeout(streamRenderTimer);
      streamRenderTimer = null;
    }
  }

  function scheduleStreamRender(sequence) {
    if (streamRenderTimer !== null) return;
    streamRenderTimer = setTimeout(() => {
      streamRenderTimer = null;
      if (sequence === searchSequence && current) {
        renderView();
        renderNotice();
      }
    }, STREAM_RENDER_DELAY);
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function resultKey(item) {
    return item.id || `${item.source_key}:${item.path || item.url || item.title}`;
  }

  function queryTerms(text) {
    return (text.toLowerCase().match(/[a-z0-9]+/g) || [])
      .filter(word => !new Set([
        "a", "an", "the", "is", "are", "was", "were", "be", "been", "being",
        "how", "what", "where", "when", "why", "who", "which", "can", "could",
        "do", "does", "did", "i", "you", "my", "me", "to", "of", "in", "on",
        "at", "for", "with", "about", "find", "some", "any", "there", "it",
        "that", "this", "and", "or", "if", "so", "will", "would", "should"
      ]).has(word));
  }

  function highlight(text, terms) {
    const wanted = new Set(terms);
    return String(text).split(/([A-Za-z0-9]+)/).map((part, index) => {
      if (index % 2 && wanted.has(part.toLowerCase())) return `<mark>${escapeHtml(part)}</mark>`;
      return escapeHtml(part);
    }).join("");
  }

  function previewBlocks(text) {
    const value = String(text).replace(/\s+/g, " ").trim();
    if (!value) return [];

    const blockCount = value.length >= 760 ? 3 : value.length >= 360 ? 2 : 1;
    if (blockCount === 1) return [value];

    const sentences = [];
    let start = 0;
    for (let index = 0; index < value.length; index++) {
      if (!/[.!?。！？]/u.test(value[index])) continue;
      if (index + 1 < value.length && !/\s/u.test(value[index + 1])) continue;
      sentences.push(value.slice(start, index + 1).trim());
      start = index + 1;
    }
    if (start < value.length) sentences.push(value.slice(start).trim());

    if (sentences.length >= 2) {
      const count = Math.min(blockCount, sentences.length);
      const blocks = [];
      let cursor = 0;
      for (let index = 0; index < count; index++) {
        const remainingSentences = sentences.length - cursor;
        const remainingBlocks = count - index;
        const take = Math.ceil(remainingSentences / remainingBlocks);
        blocks.push(sentences.slice(cursor, cursor + take).join(" "));
        cursor += take;
      }
      return blocks;
    }

    const words = value.split(" ");
    const blocks = [];
    let cursor = 0;
    for (let index = 0; index < blockCount; index++) {
      const remainingWords = words.length - cursor;
      const remainingBlocks = blockCount - index;
      const take = Math.ceil(remainingWords / remainingBlocks);
      blocks.push(words.slice(cursor, cursor + take).join(" "));
      cursor += take;
    }
    return blocks;
  }

  function previewEndsWithPunctuation(text) {
    return /[.!?,;:…。！？；，]["')\]]*$/u.test(text);
  }

  function activeSources() {
    // Every available source is always searched; the source filters
    // only narrow what is displayed (see renderView).
    return sources.filter(source => source.available);
  }

  function setSelectedSources(values) {
    selectedSourceKeys = new Set(
      (Array.isArray(values) ? values : values ? [values] : []).filter(Boolean)
    );
  }

  function sourceFilterParams(params) {
    selectedSourceKeys.forEach(source => params.append("source", source));
  }

  function renderSourceFilters() {
    const panel = $("sourceFilters");
    const options = $("sourceFilterOptions");
    const status = $("sourceFilterStatus");
    if (!current) {
      panel.hidden = true;
      options.replaceChildren();
      status.textContent = "";
      return;
    }
    panel.hidden = false;
    const outcomes = [...current.outcomes.values()];
    const nonEmptyOutcomes = outcomes.filter(outcome =>
      outcome.error || (current.counts[outcome.source.key] || 0) > 0
    );
    const query = sourceFilterQuery.trim().toLocaleLowerCase();
    const matching = query
      ? nonEmptyOutcomes.filter(outcome => {
        const source = outcome.source;
        return `${source.name} ${source.key}`.toLocaleLowerCase().includes(query);
      })
      : nonEmptyOutcomes;
    const sorted = matching.sort((left, right) => {
      const countDifference =
        (current.counts[right.source.key] || 0) - (current.counts[left.source.key] || 0);
      return countDifference || left.source.name.localeCompare(right.source.name);
    });
    const visible = sorted.slice(0, SOURCE_FILTER_LIMIT);
    const visibleKeys = new Set(visible.map(outcome => outcome.source.key));
    const otherOutcomes = !query
      ? nonEmptyOutcomes.filter(outcome =>
        !visibleKeys.has(outcome.source.key) && (current.counts[outcome.source.key] || 0) > 0
      )
      : [];

    const all = document.createElement("button");
    all.className = "secondary source-filter-option";
    all.type = "button";
    all.dataset.source = "";
    all.dataset.sourceAction = "all";
    all.setAttribute("aria-pressed", selectedSourceKeys.size ? "false" : "true");
    all.textContent = "All Sources";

    const entries = visible.map(outcome => {
      // Counts come from the ranked pool (server-reported), not per-source
      // candidate lists, so they match what the filtered view actually shows.
      const count = current.counts[outcome.source.key] || 0;
      const cls = outcome.error
        ? "source-filter-option err"
        : count > 0 ? "source-filter-option ok" : "source-filter-option";
      const label = outcome.error ? `${outcome.source.name}: ${outcome.error}` : `${outcome.source.name}: ${count}`;
      const button = document.createElement("button");
      button.className = cls;
      button.type = "button";
      button.dataset.source = outcome.source.key;
      button.disabled = Boolean(outcome.error);
      button.setAttribute(
        "aria-pressed",
        selectedSourceKeys.has(outcome.source.key) ? "true" : "false"
      );
      button.textContent = label;
      return button;
    });
    const otherKeys = otherOutcomes.map(outcome => outcome.source.key);
    if (!selectedSourceKeys.size && !query && otherKeys.length) {
      const otherCount = otherOutcomes.reduce(
        (total, outcome) => total + (current.counts[outcome.source.key] || 0),
        0
      );
      const other = document.createElement("button");
      other.className = "source-filter-option ok";
      other.type = "button";
      other.dataset.sourceAction = "other";
      other.setAttribute("aria-pressed", "false");
      other.textContent = `Other: ${otherCount}`;
      entries.push(other);
    }
    options.replaceChildren(all, ...entries);

    if (!matching.length) {
      status.textContent = query
        ? "No matching sources."
        : outcomes.length ? "No sources have results." : "No sources have reported yet.";
    } else if (!query && matching.length > SOURCE_FILTER_LIMIT) {
      status.textContent = `Showing ${visible.length} of ${matching.length} sources. Search to find a source.`;
    } else if (matching.length > visible.length) {
      status.textContent = `${visible.length} of ${matching.length} matching sources shown. Refine your search to find a source.`;
    } else {
      status.textContent = "";
    }
  }

  function renderFilterLine(count) {
    const selected = [...selectedSourceKeys];
    $("filterLine").innerHTML = selected.length
      ? `Showing only <strong>${escapeHtml(selected.map(key =>
        current.outcomes.get(key)?.source.name ||
        sources.find(source => source.key === key)?.name ||
        key
      ).join(", "))}</strong>: ${count} result${count === 1 ? "" : "s"}.
         <button class="linklike" type="button" data-source="">Show all sources</button>`
      : "";
  }

  function setText(node, selector, text) {
    node.querySelector(selector).textContent = text;
  }

  function mediaBadge(mimetype) {
    const mime = String(mimetype || "").toLowerCase();
    if (!mime || mime === "text/html") return null;
    if (mime.startsWith("video/")) return {icon: "▶", label: "Video"};
    if (mime.startsWith("audio/")) return {icon: "♪", label: "Audio"};
    if (mime.startsWith("image/")) return {icon: "IMG", label: "Image"};
    if (mime === "application/pdf") return {icon: "PDF", label: "PDF"};
    if (mime.startsWith("text/")) return {icon: "TXT", label: "Text"};
    return {icon: "FILE", label: "File"};
  }

  function appendMediaBadge(title, mimetype) {
    const media = mediaBadge(mimetype);
    if (!media) return;
    const badge = document.createElement("span");
    badge.className = "result-media";
    badge.title = media.label;
    badge.setAttribute("aria-label", media.label);
    badge.textContent = media.icon;
    title.append(" ", badge);
  }

  function modifiedClick(event) {
    return event.button !== 0 ||
      event.metaKey ||
      event.ctrlKey ||
      event.shiftKey ||
      event.altKey;
  }

  function articleUrlValue(articleUrl) {
    return articleUrl.pathname + articleUrl.search + articleUrl.hash;
  }

  function readModalUrl(value) {
    if (!value) return null;
    try {
      const articleUrl = new URL(value, location.href);
      if (
        articleUrl.origin !== location.origin ||
        !articleUrl.pathname.startsWith("/article/")
      ) {
        return null;
      }
      return articleUrl;
    } catch (_) {
      return null;
    }
  }

  function showArticleModal(articleUrl) {
    const modal = $("articleModal");
    const frame = $("articleModalFrame");
    if (!modal || !frame) return;
    if (modal.hidden) modalPreviousFocus = document.activeElement;
    const shouldLoad = activeModalUrl !== articleUrl;
    activeModalUrl = articleUrl;
    modalRootPending = shouldLoad;
    if (shouldLoad) frame.src = articleUrl;
    modal.hidden = false;
    document.body.classList.add("modal-open");
    frame.focus();
  }

  function openArticleModal(link) {
    const articleUrl = new URL(link.href, location.href);
    if (current) {
      history.pushState(
        {...(history.state || {}), zimanticModal: true},
        "",
        makeStateUrl(
          current.question,
          selectedSourceKeys,
          current.page,
          articleUrlValue(articleUrl)
        )
      );
    }
    showArticleModal(articleUrl.href);
  }

  function closeArticleModal({navigateHistory = true} = {}) {
    const modal = $("articleModal");
    const frame = $("articleModalFrame");
    if (!modal || modal.hidden) return;
    if (navigateHistory && new URL(location.href).searchParams.has("modal")) {
      if (history.state?.zimanticModal) {
        history.back();
        return;
      }
      const url = new URL(location.href);
      url.searchParams.delete("modal");
      history.replaceState(history.state, "", url.pathname + url.search + url.hash);
    }
    modal.hidden = true;
    document.body.classList.remove("modal-open");
    activeModalUrl = null;
    modalRootPending = false;
    if (frame) frame.src = "about:blank";
    if (modalPreviousFocus instanceof HTMLElement && document.contains(modalPreviousFocus)) {
      modalPreviousFocus.focus();
    }
    modalPreviousFocus = null;
  }

  $("articleModalFrame").addEventListener("load", () => {
    const modal = $("articleModal");
    const frame = $("articleModalFrame");
    if (
      modal.hidden ||
      !modalRootPending ||
      !frame.src ||
      frame.src === "about:blank"
    ) {
      return;
    }
    modalRootPending = false;
    // Sandboxed documents have an opaque origin, so only "*" can target them.
    frame.contentWindow.postMessage({type: "zimantic-modal-root"}, "*");
  });
  window.addEventListener("message", event => {
    const frame = $("articleModalFrame");
    if (event.source !== frame.contentWindow) return;
    if (event.data?.type === "zimantic-article-close") closeArticleModal();
  });

  function setResultNode(node, item) {
    node.dataset.key = resultKey(item);
    const title = node.querySelector(".result-title");
    title.replaceChildren();
    let displayTitle = item.title || "(untitled)";
    if (item.url) {
      const link = document.createElement("a");
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener";
      if (item.mimetype) link.dataset.mimetype = item.mimetype;
      link.textContent = displayTitle;
      title.appendChild(link);
    } else {
      title.textContent = displayTitle;
    }
    appendMediaBadge(title, item.mimetype);
    setText(node, ".result-meta", item.source || "");
    const snippet = node.querySelector(".result-snippet");
    const lead = item.lead || "";
    if (lead) {
      snippet.className = "result-snippet";
      const blocks = previewBlocks(lead);
      if (!previewEndsWithPunctuation(lead) && blocks.length) {
        blocks[blocks.length - 1] += "…";
      }
      snippet.innerHTML = blocks
        .map(block => `<p>${highlight(block, current ? current.terms : [])}</p>`)
        .join("");
    } else {
      snippet.className = "result-snippet none";
      snippet.textContent = "No preview available for this result.";
    }
    let thumb = node.querySelector(".result-thumb");
    if (item.url) {
      if (!thumb) {
        thumb = document.createElement("div");
        thumb.className = "result-thumb";
        node.appendChild(thumb);
      }
      thumb.dataset.url = item.url;
    } else if (thumb) {
      thumb.remove();
    }
  }

  function newResultNode(item) {
    const node = document.createElement("li");
    node.className = "result";
    node.innerHTML = `<div class="result-body">
      <div class="result-title"></div>
      <div class="result-meta"></div>
      <div class="result-snippet"></div>
    </div>`;
    setResultNode(node, item);
    return node;
  }

  function animateRemoval(node, animate = true) {
    if (!animate || reducedMotion() || !node.animate) {
      node.remove();
      return;
    }
    node.classList.add("result-exit");
    const animation = node.animate(
      [{ opacity: 1, transform: "translateY(0)" }, { opacity: 0, transform: "translateY(-6px)" }],
      { duration: 180, easing: "ease-in", fill: "forwards" }
    );
    animation.finished.then(() => node.remove(), () => node.remove());
  }

  function renderResults(items) {
    if (!items.length) {
      const oldList = resultList;
      if (oldList) {
        [...oldList.children].forEach(node => animateRemoval(node, !current?.streaming));
        resultList = null;
        setTimeout(() => {
          if (!oldList.children.length) oldList.remove();
        }, reducedMotion() ? 0 : 200);
      }
      $("results").querySelectorAll(".empty").forEach(node => node.remove());
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = current?.streaming
        ? "" // waiting for search results... but they often appear too fast to read this text so better to print nothing...
        : "No results found in the available sources. Try using different words.";
      $("results").appendChild(empty);
      return;
    }
    $("results").querySelectorAll(".empty").forEach(node => node.remove());
    if (!resultList) {
      resultList = document.createElement("ol");
      resultList.className = "results";
      $("results").appendChild(resultList);
    }
    const existing = new Map([...resultList.children].map(node => [node.dataset.key, node]));
    const before = new Map([...resultList.children].map(node => [node.dataset.key, node.getBoundingClientRect()]));
    const wanted = new Set(items.map(resultKey));
    const animateChanges = !current?.streaming;
    existing.forEach((node, key) => {
      if (!wanted.has(key)) animateRemoval(node, animateChanges);
    });
    const added = [];
    items.forEach(item => {
      const key = resultKey(item);
      const node = existing.get(key) || newResultNode(item);
      setResultNode(node, item);
      if (!existing.has(key)) added.push(node);
      resultList.appendChild(node);
    });
    const after = new Map([...resultList.children].map(node => [node.dataset.key, node.getBoundingClientRect()]));
    if (!reducedMotion()) {
      if (animateChanges) {
        for (const [key, node] of [...resultList.children].map(node => [node.dataset.key, node])) {
          const oldBox = before.get(key);
          const newBox = after.get(key);
          if (oldBox && newBox && node.animate) {
            const dx = oldBox.left - newBox.left;
            const dy = oldBox.top - newBox.top;
            if (dx || dy) {
              node.animate(
                [{ transform: `translate(${dx}px,${dy}px)` }, { transform: "translate(0,0)" }],
                { duration: 220, easing: "ease-out" }
              );
            }
          }
        }
      }
      added.forEach(node => {
        node.classList.add("result-enter");
        requestAnimationFrame(() => node.classList.remove("result-enter"));
      });
    }
    loadThumbnails(items);
  }

  function renderPager(total, pageCount) {
    const pager = $("pager");
    pager.innerHTML = "";
    if (total <= PAGE_SIZE && pageCount <= 1) return;
    const pageLink = (text, page, disabled) => {
      const link = document.createElement(disabled ? "span" : "a");
      link.textContent = text;
      if (disabled) {
        link.className = "disabled";
        link.setAttribute("aria-disabled", "true");
      } else {
        // A real href keeps middle-click/open-in-new-tab working; the click
        // handler below intercepts it to avoid a full document reload.
        link.href = makePageUrl(page);
        link.dataset.page = String(page);
      }
      return link;
    };
    const prev = pageLink("← Previous", current.page - 1, current.page === 0);
    const next = pageLink("Next →", current.page + 1, current.page >= pageCount - 1);
    const label = document.createElement("span");
    const from = total ? current.page * PAGE_SIZE + 1 : 0;
    const to = Math.min((current.page + 1) * PAGE_SIZE, total);
    label.textContent = `${from}–${to} of ${total}`;
    pager.append(prev, label, next);
  }

  function renderView() {
    if (!current) return;
    // The server already sliced this page and applied any display filter, so
    // there is nothing to slice here.
    const pageCount = Math.max(1, Math.ceil(current.total / PAGE_SIZE));
    if (current.completed === current.sourcesTotal) {
      if (current.page >= pageCount) current.page = pageCount - 1;
      if (current.page < 0) current.page = 0;
    }
    renderSourceFilters();
    renderFilterLine(current.total);
    renderPager(current.total, pageCount);
    renderResults(current.pageItems);
  }

  function renderNotice() {
    if (!current) {
      $("notice").textContent = "";
      return;
    }
    const outcomes = [...current.outcomes.values()];
    const errors = outcomes.filter(outcome => outcome.error);
    $("notice").innerHTML = current.completed === current.sourcesTotal && outcomes.length > 0 &&
      errors.length === outcomes.length
      ? "<div class='notice'><strong>All sources failed.</strong> Check your sources and the Kiwix service, then reload or restart the server.</div>"
      : "";
  }

  function cancelThumbnails() {
    thumbnailGeneration++;
    thumbnailQueue.length = 0;
    thumbnailControllers.forEach(controller => controller.abort());
    thumbnailControllers.clear();
  }

  function pumpThumbnails() {
    while (activeThumbnails < THUMB_CONCURRENCY && thumbnailQueue.length) {
      const task = thumbnailQueue.shift();
      activeThumbnails++;
      fetchThumbnail(task.url).then(task.resolve, () => task.resolve(null)).finally(() => {
        activeThumbnails--;
        pumpThumbnails();
      });
    }
  }

  async function readStart(response, maxBytes) {
    if (!response.body || !response.body.getReader) return (await response.text()).slice(0, maxBytes);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let text = "";
    let bytes = 0;
    try {
      while (bytes < maxBytes) {
        const part = await reader.read();
        if (part.done) break;
        bytes += part.value.byteLength;
        text += decoder.decode(part.value, { stream: true });
      }
    } finally {
      reader.cancel().catch(() => {});
    }
    return text;
  }

  function pickThumbnail(html, articleUrl) {
    const doc = new DOMParser().parseFromString(html, "text/html");
    for (const image of doc.querySelectorAll("img")) {
      const src = (image.getAttribute("src") || "").trim();
      if (!src || src.startsWith("data:") || /\.svg(?:[?#]|$)/i.test(src)) continue;
      if (/(^|[\W_])(icon|logo|avatar|symbol|sprite|spacer|blank)/i.test(src)) continue;
      try { return new URL(src, articleUrl).href; } catch (_) {}
    }
    return null;
  }

  async function fetchThumbnail(url) {
    const controller = new AbortController();
    thumbnailControllers.add(controller);
    try {
      const response = await fetch(url, { signal: controller.signal });
      if (!response.ok) return null;
      return pickThumbnail(await readStart(response, THUMB_LIMIT), url);
    } catch (_) {
      return null;
    } finally {
      thumbnailControllers.delete(controller);
    }
  }

  function thumbnailFor(url) {
    if (!thumbnailCache.has(url)) {
      thumbnailCache.set(url, new Promise(resolve => {
        thumbnailQueue.push({ url, resolve });
        pumpThumbnails();
      }));
    }
    return thumbnailCache.get(url);
  }

  function loadThumbnails(items) {
    const generation = thumbnailGeneration;
    items.forEach(item => {
      if (!item.url) return;
      thumbnailFor(item.url).then(src => {
        if (generation !== thumbnailGeneration) return;
        const node = resultList && [...resultList.children].find(child => child.dataset.key === resultKey(item));
        const slot = node && node.querySelector(".result-thumb");
        if (!slot || slot.firstChild) return;
        if (!src) { slot.remove(); return; }
        const image = document.createElement("img");
        image.alt = "";
        image.loading = "lazy";
        image.decoding = "async";
        image.src = src;
        image.addEventListener("error", () => slot.remove());
        slot.appendChild(image);
      });
    });
  }

  function waitForRetry(delay, signal) {
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        signal.removeEventListener("abort", abort);
        resolve();
      }, delay);
      const abort = () => {
        clearTimeout(timer);
        signal.removeEventListener("abort", abort);
        const error = new Error("aborted");
        error.name = "AbortError";
        reject(error);
      };
      signal.addEventListener("abort", abort, { once: true });
      if (signal.aborted) abort();
    });
  }

  async function consumeStream(response, sequence) {
    if (!response.body) throw new Error("streaming response has no body");
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    let busy = false;
    const applyPage = event => {
      current.completed = event.completed;
      current.pageItems = event.results || [];
      current.total = event.total || 0;
      current.hasMore = Boolean(event.has_more);
      if (event.counts) current.counts = event.counts;
    };
    const consumeLine = line => {
      if (!line.trim() || sequence !== searchSequence) return;
      const event = JSON.parse(line);
      if (event.type === "started") {
        current.sourcesTotal = event.total_sources || 0;
        current.completed = 0;
        $("status").textContent = `Searching ${current.sourcesTotal} source${current.sourcesTotal === 1 ? "" : "s"}…`;
      } else if (event.type === "source") {
        current.completed = event.completed;
        current.outcomes.set(event.source.key, event);
        if (typeof event.count === "number") current.counts[event.source.key] = event.count;
        $("status").textContent = `${event.completed}/${event.total_sources} sources complete`;
        scheduleStreamRender(sequence);
      } else if (event.type === "snapshot") {
        applyPage(event);
        scheduleStreamRender(sequence);
      } else if (event.type === "done") {
        applyPage(event);
        current.streaming = false;
        cancelStreamRender();
        $("status").textContent = current.sourcesTotal
          ? `${current.completed}/${current.sourcesTotal} sources complete · ${current.total} result${current.total === 1 ? "" : "s"}`
          : "No searchable sources.";
        renderView();
        renderNotice();
      } else if (event.type === "error") {
        busy = Boolean(event.busy);
        $("status").textContent = event.error || "Search failed";
      }
    };
    while (true) {
      const part = await reader.read();
      if (part.done) break;
      buffer += decoder.decode(part.value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop() || "";
      lines.forEach(consumeLine);
    }
    if (buffer) consumeLine(buffer);
    if (busy) return true;
    if (sequence === searchSequence && current && current.streaming) {
      current.streaming = false;
      cancelStreamRender();
      renderView();
    }
    return false;
  }

  async function runSearch(question, selectedSources = [], page = 0) {
    question = question.trim();
    if (!question) return;
    if (requestController) requestController.abort();
    if (pageController) pageController.abort();
    cancelStreamRender();
    cancelThumbnails();
    thumbnailCache.clear();
    const controller = new AbortController();
    requestController = controller;
    const sequence = ++searchSequence;
    const pageIndex = Number.isInteger(page) && page >= 0 ? page : 0;
    setSelectedSources(selectedSources);
    current = {
      question,
      terms: queryTerms(question),
      outcomes: new Map(),
      counts: {},
      pageItems: [],
      total: 0,
      hasMore: false,
      completed: 0,
      sourcesTotal: 0,
      streaming: true,
      page: pageIndex
    };
    document.body.classList.add("search-active");
    window.scrollTo({ top: 0, left: 0, behavior: "auto" });
    $("searchButton").disabled = true;
    $("status").innerHTML = `Searching for <span class="query-used">"${escapeHtml(question)}"</span>…`;
    $("notice").textContent = "";
    $("pager").innerHTML = "";
    renderResults([]);
    try {
      const selected = activeSources();
      if (!selected.length) {
        $("status").textContent = "No sources are available to search.";
        return;
      }
      const params = new URLSearchParams({
        q: question,
        limit: String(PAGE_SIZE),
        offset: String(pageIndex * PAGE_SIZE)
      });
      sourceFilterParams(params);
      // Always query every source: no zim params means the server searches all
      // currently available sources. The server ranks one pool and sends only
      // this page; page size, offset and the display filter are not cached keys.
      let busyRetries = 0;
      while (true) {
        const response = await fetch("/search/stream?" + params, { signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const busy = await consumeStream(response, sequence);
        if (!busy || busyRetries >= BUSY_RETRY_LIMIT || sequence !== searchSequence) break;
        busyRetries++;
        const delay = Math.min(
          BUSY_RETRY_BASE_DELAY * 2 ** (busyRetries - 1),
          BUSY_RETRY_MAX_DELAY
        );
        $("status").textContent = `Server is busy; retrying in ${delay / 1000}s…`;
        await waitForRetry(delay, controller.signal);
      }
    } catch (error) {
      if (error.name !== "AbortError" && sequence === searchSequence) {
        $("status").textContent = `Search failed: ${error.message}`;
      }
    } finally {
      if (sequence === searchSequence) {
        current.streaming = false;
        cancelStreamRender();
        $("searchButton").disabled = false;
        requestController = null;
      }
    }
  }

  async function loadPage(page) {
    // Paging and source filtering reuse the server's cached ranked pool and
    // return a single page. No full document reload, no re-stream.
    if (!current) return;
    const sequence = searchSequence;
    const pageIndex = Number.isInteger(page) && page >= 0 ? page : 0;
    if (pageController) pageController.abort();
    const controller = new AbortController();
    pageController = controller;
    const params = new URLSearchParams({
      q: current.question,
      limit: String(PAGE_SIZE),
      offset: String(pageIndex * PAGE_SIZE)
    });
    sourceFilterParams(params);
    $("status").textContent = "Loading page…";
    try {
      const response = await fetch("/search?" + params, { signal: controller.signal });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const items = await response.json();
      if (sequence !== searchSequence || controller !== pageController) return;
      current.page = pageIndex;
      current.pageItems = items;
      current.total = Number(response.headers.get("X-Total-Count") || items.length);
      current.hasMore = response.headers.get("X-Has-More") === "true";
      const from = current.total ? pageIndex * PAGE_SIZE + 1 : 0;
      const to = Math.min((pageIndex + 1) * PAGE_SIZE, current.total);
      $("status").textContent = current.total
        ? `${from}–${to} of ${current.total} result${current.total === 1 ? "" : "s"}`
        : "No results.";
      window.scrollTo({ top: 0, left: 0, behavior: "auto" });
      renderView();
    } catch (error) {
      if (
        error.name !== "AbortError" &&
        sequence === searchSequence &&
        controller === pageController
      ) {
        $("status").textContent = `Search failed: ${error.message}`;
      }
    } finally {
      if (controller === pageController) pageController = null;
    }
  }

  function makeStateUrl(question, selectedSources, page, modal = null) {
    // Keep search and modal state in the query string so links are shareable
    // and Back/Forward just work.
    const url = new URL(location.href);
    url.hash = "";
    url.search = "";
    url.searchParams.set("q", question);
    const sourceValues = selectedSources instanceof Set
      ? [...selectedSources]
      : Array.isArray(selectedSources)
        ? selectedSources
        : selectedSources ? [selectedSources] : [];
    sourceValues.forEach(source => url.searchParams.append("src", source));
    if (page > 0) url.searchParams.set("page", String(page + 1));
    if (modal) url.searchParams.set("modal", modal);
    return url.pathname + url.search;
  }

  function makePageUrl(page) {
    return makeStateUrl(current.question, selectedSourceKeys, page);
  }

  function readLocationState() {
    const params = new URLSearchParams(location.search);
    const pageNumber = Number.parseInt(params.get("page") || "1", 10);
    return {
      question: (params.get("q") || "").trim(),
      selectedSources: [...new Set(params.getAll("src").filter(Boolean))],
      page: Number.isInteger(pageNumber) && pageNumber >= 1 ? pageNumber - 1 : 0,
      modal: params.get("modal") || null
    };
  }

  function syncArticleModal(modalValue) {
    const articleUrl = readModalUrl(modalValue);
    if (articleUrl) {
      showArticleModal(articleUrl.href);
    } else {
      closeArticleModal({navigateHistory: false});
    }
  }

  $("sourceFilterSearch").addEventListener("input", event => {
    sourceFilterQuery = event.target.value;
    renderSourceFilters();
  });

  $("sourceFilterOptions").addEventListener("click", event => {
    const button = event.target.closest("button[data-source], button[data-source-action]");
    if (!button || button.disabled || !current) return;
    const key = button.dataset.source || null;
    if (button.dataset.sourceAction === "all") {
      selectedSourceKeys.clear();
    } else if (button.dataset.sourceAction === "other") {
      const outcomes = [...current.outcomes.values()];
      const nonEmptyOutcomes = outcomes.filter(outcome =>
        outcome.error || (current.counts[outcome.source.key] || 0) > 0
      );
      const visibleKeys = new Set(
        nonEmptyOutcomes
          .sort((left, right) => {
            const countDifference =
              (current.counts[right.source.key] || 0) - (current.counts[left.source.key] || 0);
            return countDifference || left.source.name.localeCompare(right.source.name);
          })
          .slice(0, SOURCE_FILTER_LIMIT)
          .map(outcome => outcome.source.key)
      );
      setSelectedSources(
        nonEmptyOutcomes
          .filter(outcome =>
            !visibleKeys.has(outcome.source.key) && (current.counts[outcome.source.key] || 0) > 0
          )
          .map(outcome => outcome.source.key)
      );
    } else if (selectedSourceKeys.has(key)) {
      selectedSourceKeys.delete(key);
    } else {
      selectedSourceKeys.add(key);
    }
    history.pushState(null, "", makeStateUrl(current.question, selectedSourceKeys, 0));
    renderSourceFilters();
    loadPage(0);
  });

  $("filterLine").addEventListener("click", event => {
    const button = event.target.closest("button[data-source]");
    if (button) {
      selectedSourceKeys.clear();
      history.pushState(null, "", makeStateUrl(current.question, selectedSourceKeys, 0));
      renderSourceFilters();
      loadPage(0);
    }
  });

  $("results").addEventListener("click", event => {
    const target = event.target instanceof Element ? event.target : null;
    const link = target?.closest(".result-title a[href]");
    if (!link || modifiedClick(event)) return;
    if (new URL(link.href, location.href).origin !== location.origin) return;
    if (link.dataset.mimetype !== "text/html") return;
    event.preventDefault();
    openArticleModal(link);
  });

  $("pager").addEventListener("click", event => {
    const link = event.target.closest("a[data-page]");
    if (!link || !current) return;
    event.preventDefault();
    const page = Number(link.dataset.page);
    history.pushState(null, "", makeStateUrl(current.question, selectedSourceKeys, page));
    loadPage(page);
  });

  $("articleModal").addEventListener("click", event => {
    if (event.target.classList.contains("article-modal-backdrop")) {
      closeArticleModal();
    }
  });
  window.addEventListener("keydown", event => {
    if (event.key === "Escape" && !$("articleModal").hidden) {
      event.preventDefault();
      closeArticleModal();
    }
  });

  function resetResults() {
    // Clear everything a search painted, without touching history. Removes
    // search-active so the empty page re-centers like a fresh load.
    clearTimeout(autoSubmitTimer);
    autoSubmitTimer = null;
    if (requestController) requestController.abort();
    requestController = null;
    if (pageController) pageController.abort();
    pageController = null;
    searchSequence++;  // invalidate any in-flight stream callbacks
    cancelStreamRender();
    cancelThumbnails();
    thumbnailCache.clear();
    current = null;
    selectedSourceKeys = new Set();
    resultList = null;
    document.body.classList.remove("search-active");
    $("status").textContent = "";
    $("sourceFilters").hidden = true;
    $("sourceFilterOptions").replaceChildren();
    $("sourceFilterStatus").textContent = "";
    sourceFilterQuery = "";
    $("sourceFilterSearch").value = "";
    $("filterLine").innerHTML = "";
    $("notice").textContent = "";
    $("pager").innerHTML = "";
    const empty = document.createElement("div");
    empty.className = "empty";
    $("results").replaceChildren(empty);
    $("searchButton").disabled = false;
  }

  function clearSearch(pushHistory) {
    // Explicitly submitted with an empty field: drop the prior search and
    // re-center. A cleared-but-not-submitted field keeps its results, so an
    // empty debounce never wipes the page on its own.
    const hadSearch = current !== null || Boolean(location.search);
    resetResults();
    $("question").value = "";
    if (hadSearch) {
      history[pushHistory ? "pushState" : "replaceState"](null, "", location.pathname);
    }
    $("question").focus();
    window.scrollTo({ top: 0, left: 0, behavior: "auto" });
  }

  function submitSearch(pushHistory) {
    const question = $("question").value.trim();
    if (!question) {
      clearSearch(pushHistory);
      return;
    }
    history[pushHistory ? "pushState" : "replaceState"](
      null,
      "",
      makeStateUrl(question, [], 0)
    );
    runSearch(question);
  }

  $("question").addEventListener("input", () => {
    clearTimeout(autoSubmitTimer);
    if (!$("question").value.trim()) return;
    autoSubmitTimer = setTimeout(() => submitSearch(false), AUTO_SUBMIT_DELAY);
  });

  $("searchForm").addEventListener("submit", event => {
    event.preventDefault();
    clearTimeout(autoSubmitTimer);
    submitSearch(true);
  });

  window.addEventListener("popstate", () => {
    const state = readLocationState();
    syncArticleModal(state.modal);
    if (!state.question) {
      // Navigated back/forward to the no-search entry: match it.
      resetResults();
      $("question").value = "";
      return;
    }
    $("question").value = state.question;
    if (current && current.question === state.question) {
      // Same query: just move the page or display filter, no re-search.
      setSelectedSources(state.selectedSources);
      loadPage(state.page);
    } else {
      runSearch(state.question, state.selectedSources, state.page);
    }
  });

  async function initialize() {
    try {
      // Source discovery is read-only; refreshing the index/catalog set is an
      // admin action done only via `zimantic reload` or SIGHUP.
      const [configResponse, sourcesResponse] = await Promise.all([
        fetch("/config"),
        fetch("/sources"),
      ]);
      if (configResponse.ok) {
        const config = await configResponse.json();
        if (Number.isInteger(config.page_size) && config.page_size > 0) {
          PAGE_SIZE = config.page_size;
        }
      }
      if (!sourcesResponse.ok) throw new Error(`HTTP ${sourcesResponse.status}`);
      sources = await sourcesResponse.json();
    } catch (error) {
      $("status").textContent = `Could not load sources: ${error.message}`;
    }
    const state = readLocationState();
    syncArticleModal(state.modal);
    if (state.question) {
      $("question").value = state.question;
      runSearch(state.question, state.selectedSources, state.page);
    } else {
      $("question").focus();
    }
  }

  initialize();
})();
</script>
</body>
</html>
