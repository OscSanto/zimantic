<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges">
  <!-- darkest outer edge -->
  <g fill="#006478">
    <rect x="1" y="0" width="14" height="16"/>
    <rect x="0" y="1" width="16" height="14"/>
  </g>
  <!-- mid edge -->
  <g fill="#00b4c4">
    <rect x="2" y="1" width="12" height="14"/>
    <rect x="1" y="2" width="14" height="12"/>
  </g>
  <!-- cyan face -->
  <g fill="#22e8f4">
    <rect x="3" y="2" width="10" height="12"/>
    <rect x="2" y="3" width="12" height="10"/>
  </g>
  <!-- question mark -->
  <g fill="#000">
    <rect x="6" y="3" width="4" height="1"/>
    <rect x="5" y="4" width="2" height="1"/>
    <rect x="9" y="4" width="2" height="2"/>
    <rect x="8" y="6" width="2" height="1"/>
    <rect x="7" y="7" width="2" height="2"/>
    <rect x="7" y="10" width="2" height="3"/>
  </g>
</svg>
